<!doctype html>
<html lang="pt-BR" class="neko-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NekoGPT é um app desktop de companhia com IA, personagens Live2D, voz, memória e controles para criadores."
    />
    <meta
      name="keywords"
      content="NekoGPT, AI companion, Live2D, AI VTuber, voice chat, desktop companion, virtual assistant"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NekoGPT - App desktop de companhia com IA" />
    <meta
      property="og:description"
      content="Uma experiência de companhia com IA, personagens, voz, memória e integrações para criadores."
    />
    <meta property="og:image" content="./assets/images/dashboard-hero.png" />
    <meta name="theme-color" content="#161f42" />
    <title>NekoGPT - App desktop de companhia com IA</title>
    <link rel="icon" type="image/png" href="./assets/images/icon-256.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Prioritize the actual hero instead of preloading the retired Live2D preview. -->
    <link rel="preload" href="./assets/images/neko-hero-poster.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="./src/hero-motion.css?v=14" as="style" />
    <link rel="stylesheet" href="./src/paw-spacing.css?v=120" />
    <link rel="stylesheet" href="./src/wishlist-badge.css?v=3" />

    <style>
      html,body{min-height:100%;margin:0;background:#161f42;color:#fff;font-family:Inter,system-ui,sans-serif}
      #preview-loader{min-height:100vh;display:grid;place-items:center;text-align:center}
      #preview-loader span{opacity:.72}
      /* The original payload is an intermediate implementation, never a visible page. */
      html.neko-booting body > :not(#neko-bootstrap-screen):not(script) {
        visibility: hidden !important;
      }
      #neko-bootstrap-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: flex-start;
        background: #161f42 url('./assets/images/neko-hero-poster.webp') center center / cover no-repeat;
        opacity: 1;
        pointer-events: auto;
        transition: opacity .42s ease-in-out;
      }
      #neko-bootstrap-screen::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg,rgba(4,9,28,.86),rgba(5,10,29,.65) 26%,rgba(7,13,30,.12) 72%),
                    linear-gradient(to bottom,transparent 62%,rgba(255,245,250,.4) 87%,#fff5fa 100%);
        pointer-events: none;
      }
      #neko-bootstrap-screen img {
        position: relative;
        display: block;
        width: min(36vw,655px);
        height: auto;
        margin: clamp(44px,5.5vh,66px) 0 0 clamp(22px,2.1vw,42px);
        animation: nekoBootstrapBreathe 4s ease-in-out infinite alternate;
      }
      #neko-bootstrap-screen span {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .22em;
        text-shadow: 0 1px 8px rgba(0,0,0,.6);
      }
      #neko-bootstrap-screen span::after {
        content:'';
        display:block;
        width:124px;
        height:3px;
        margin:11px auto 0;
        border-radius:999px;
        background:linear-gradient(90deg, transparent 0%, #f3b0d4 30%, #fff4fd 50%, #f3b0d4 70%, transparent 100%);
        background-size:200% 100%;
        animation:nekoLoadingGlow 1.8s ease-in-out infinite;
        filter:drop-shadow(0 0 5px rgba(250,181,220,.65));
      }
      #neko-bootstrap-screen.neko-bootstrap-done {opacity:0;pointer-events:none}
      @keyframes nekoLoadingGlow {from{background-position:100% 0;opacity:.46}50%{opacity:1}to{background-position:-100% 0;opacity:.46}}
      @keyframes nekoBootstrapBreathe {from{transform:translateY(0)}to{transform:translateY(-4px)}}
      @media(max-width:1199px) {
        #neko-bootstrap-screen img {width:min(49vw,505px);margin:91px 0 0 22px}
      }
      @media(max-width:860px) {
        #neko-bootstrap-screen img {width:min(84vw,470px);margin:95px 0 0 14px}
      }
      @media(prefers-reduced-motion:reduce) {
        #neko-bootstrap-screen, #neko-bootstrap-screen img, #neko-bootstrap-screen span::after {animation:none;transition:none}
      }
    </style>
  </head>
  <body>
    <div id="neko-bootstrap-screen" role="status" aria-label="Carregando NekoGPT">
      <img src="./assets/images/nekogpt-wordmark-hero.png" width="900" height="436" alt="NekoGPT" />
      <span>CARREGANDO</span>
    </div>
    <div id="preview-loader"><span>Carregando preview do NekoGPT…</span></div>
    <!-- deploy refresh: cute window controls -->
    <script>
      (() => {
        // Keep the splash only until the hero/navigation are styled, not until the video decodes.
        const bootstrapScreen = document.getElementById('neko-bootstrap-screen');
        let bootFinished = false;
        const finishBootstrap = () => {
          if (bootFinished) return;
          bootFinished = true;
          document.documentElement.classList.remove('neko-booting');
          if (bootstrapScreen) {
            bootstrapScreen.classList.add('neko-bootstrap-done');
            setTimeout(() => bootstrapScreen.remove(), 470);
          }
        };

        const payloadParts = ["./payload/part-01.txt", "./payload/part-02.txt", "./payload/part-03.txt", "./payload/part-04.txt", "./payload/part-05.txt", "./payload/part-06.txt", "./payload/part-07.txt", "./payload/part-08.txt", "./payload/part-09.txt", "./payload/part-10.txt", "./payload/part-11.txt", "./payload/part-12.txt", "./payload/part-13.txt", "./payload/part-14.txt", "./payload/part-15.txt", "./payload/part-16.txt", "./payload/part-17.txt", "./payload/part-18.txt", "./payload/part-19.txt", "./payload/part-20.txt", "./payload/part-21.txt", "./payload/part-22.txt", "./payload/part-23.txt", "./payload/part-24.txt"];

        const loadScript = (src) => new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error(`Falha ao carregar ${src}`));
          document.body.appendChild(script);
        });

        const updateLocalizedCopy = (payload) => {
          const replacements = [
            [
              'Conecte-se ao Twitch, Discord, Obsidian, Google e muito mais. Sua assistente de IA funciona onde você estiver.',
              'Conecte-se ao Twitch, Discord, Obsidian, e muito mais. Sua companheira de IA funciona onde você quiser.'
            ],
            [
              'Connect to Twitch, Discord, Obsidian, Google, and much more. Your AI assistant works wherever you are.',
              'Connect to Twitch, Discord, Obsidian, and much more. Your AI companion works wherever you want.'
            ],
            [
              'Conéctate a Twitch, Discord, Obsidian, Google y mucho más. Tu asistente de IA funciona donde estés.',
              'Conéctate a Twitch, Discord, Obsidian y mucho más. Tu compañera de IA funciona donde quieras.'
            ],
            [
              'Connectez Twitch, Discord, Obsidian, Google et bien plus. Votre assistante IA fonctionne où que vous soyez.',
              'Connectez Twitch, Discord, Obsidian et bien plus encore. Votre compagne IA fonctionne où vous le souhaitez.'
            ]
          ];

          replacements.forEach(([currentText, nextText]) => {
            payload.body = payload.body.split(currentText).join(nextText);
            payload.js = payload.js.split(currentText).join(nextText);
          });

          return payload;
        };

        const configureNativeSoloNeko = (payload) => {
          const heroCharactersPattern = /    const heroCharacters = \[[\s\S]*?\n    \];/;
          const nativeNekoCharacter = `    const heroCharacters = [
      {
        src: "./assets/live2d/catgpt/catgpt.model3.json",
        label: "NekoGPT",
        scale: 1.42,
        anchorY: 0.5,
        offsetX: 0,
        offsetY: 0,
        zIndex: 1,
        idlePhase: 1.4,
        followX: 12,
        followY: 5,
        rotate: 0.045,
        lookOffsetY: -0.03,
      },
    ];`;

          if (!heroCharactersPattern.test(payload.js)) {
            throw new Error('Não foi possível localizar a configuração original do Live2D.');
          }

          payload.js = payload.js.replace(heroCharactersPattern, nativeNekoCharacter);
          payload.body = payload.body.replace(
            /\n\s*<p class="micro-copy"[^>]*>[\s\S]*?<\/p>/,
            ''
          );

          payload.css += `

/* Native solo Neko Live2D presentation */
.hero-showcase {
  min-height: 500px;
}

.showcase-glow,
.showcase-topbar,
.micro-copy {
  display: none !important;
}

.showcase-card {
  overflow: visible !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  transform: none !important;
}

.showcase-stage {
  min-height: 500px !important;
  overflow: visible !important;
}

.live2d-stage {
  overflow: visible !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.live2d-stage::before {
  content: none !important;
}

.live2d-loader {
  background: transparent !important;
}

@media (max-width: 760px) {
  .hero-showcase,
  .showcase-stage {
    min-height: 420px !important;
  }
}

@media (max-width: 480px) {
  .hero-showcase,
  .showcase-stage {
    min-height: 350px !important;
  }
}
`;

          return payload;
        };

        const loadPreview = async () => {
          const encoded = (await Promise.all(payloadParts.map(async (path) => {
            const response = await fetch(path); // Cache the stable payload between refreshes.
            if (!response.ok) throw new Error(`Falha ao carregar ${path}`);
            return response.text();
          }))).join('');
          const bytes = Uint8Array.from(atob(encoded), (char) => char.charCodeAt(0));
          if (!("DecompressionStream" in window)) throw new Error('Navegador sem suporte a DecompressionStream');
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
          const originalPayload = JSON.parse(await new Response(stream).text());
          const payload = configureNativeSoloNeko(updateLocalizedCopy(originalPayload));
          const style = document.createElement('style');
          style.textContent = payload.css;
          document.head.appendChild(style);
          document.body.innerHTML = payload.body;
          // body.innerHTML replaces the loading screen; restore it before the next paint.
          if (bootstrapScreen) document.body.appendChild(bootstrapScreen);
          new Function(payload.js)();

          await loadScript('./src/paw-fix.js?v=119');
          await loadScript('./src/site-customizations.js?v=129');
          await loadScript('./src/brand-feature-redesign.js?v=140');
          await loadScript('./src/feature-navigation-theme.js?v=2');
          await loadScript('./src/integrations-navigation-theme.js?v=3');
          await loadScript('./src/world-integrations-theme.js?v=2');
          await loadScript('./src/providers-navigation-theme.js?v=1');
          await loadScript('./src/install-navigation-theme.js?v=1');
          await loadScript('./src/pricing-navigation-theme.js?v=1');
          await loadScript('./src/comparison-navigation-theme.js?v=1');
          await loadScript('./src/header-logo-v2.js?v=11');
          await loadScript('./src/header-scroll-fix.js?v=5');
          await loadScript('./src/documentation-navigation.js?v=1');
          const heroMotionStyles = document.createElement('link');
          heroMotionStyles.rel = 'stylesheet';
          heroMotionStyles.href = './src/hero-motion.css?v=14';
          await new Promise((resolve, reject) => {
            heroMotionStyles.onload = resolve;
            heroMotionStyles.onerror = () => reject(new Error('Falha ao carregar os estilos do topo.'));
            document.head.appendChild(heroMotionStyles);
          });
          await loadScript('./src/hero-motion.js?v=8');
          const trailerTransitionStyles = document.createElement('link');
          trailerTransitionStyles.rel = 'stylesheet';
          trailerTransitionStyles.href = './src/trailer-transition.css?v=5';
          await new Promise((resolve) => {
            trailerTransitionStyles.onload = resolve;
            trailerTransitionStyles.onerror = resolve;
            document.head.appendChild(trailerTransitionStyles);
          });
          // Remove retired content before showing the styled landing page.
          await loadScript('./src/trailer-endcap.js?v=2');
          const hero = document.querySelector('.hero');
          if (hero) hero.classList.add('hero-with-motion');
          // The poster is ready to display; video decoding must never block the page.
          finishBootstrap();

          // Below-the-fold sections load independently of the first render.
          await loadScript('./src/trailer-video.js?v=2');
          const resourcesStyles = document.createElement('link');
          resourcesStyles.rel = 'stylesheet';
          resourcesStyles.href = './src/resources-section.css?v=4';
          await new Promise((resolve) => {
            resourcesStyles.onload = resolve;
            resourcesStyles.onerror = resolve;
            document.head.appendChild(resourcesStyles);
          });
          await loadScript('./src/resources-section.js?v=2');
          const chatFeatureStyles = document.createElement('link');
          chatFeatureStyles.rel = 'stylesheet';
          chatFeatureStyles.href = './src/chat-feature.css?v=1';
          await new Promise((resolve) => {
            chatFeatureStyles.onload = resolve;
            chatFeatureStyles.onerror = resolve;
            document.head.appendChild(chatFeatureStyles);
          });
          await loadScript('./src/chat-feature.js?v=2');
          const feature3dStyles = document.createElement('link');
          feature3dStyles.rel = 'stylesheet';
          feature3dStyles.href = './src/three-d-feature.css?v=1';
          await new Promise((resolve) => {
            feature3dStyles.onload = resolve;
            feature3dStyles.onerror = resolve;
            document.head.appendChild(feature3dStyles);
          });
          await loadScript('./src/three-d-feature.js?v=2');
          const gameplayStyles = document.createElement('link');
          gameplayStyles.rel = 'stylesheet';
          gameplayStyles.href = './src/gameplay-feature.css?v=1';
          await new Promise(resolve => {
            gameplayStyles.onload = resolve;
            gameplayStyles.onerror = resolve;
            document.head.appendChild(gameplayStyles);
          });
          await loadScript('./src/gameplay-feature.js?v=2');
          const creatorsStyles = document.createElement('link');
          creatorsStyles.rel = 'stylesheet';
          creatorsStyles.href = './src/creators-section.css?v=9';
          await new Promise((resolve, reject) => {
            creatorsStyles.onload = resolve;
            creatorsStyles.onerror = () => reject(new Error('Falha ao carregar a seção Usuários e Criador.'));
            document.head.appendChild(creatorsStyles);
          });
          await loadScript('./src/creators-section.js?v=5');
          const socialFooterStyles = document.createElement('link');
          socialFooterStyles.rel = 'stylesheet';
          socialFooterStyles.href = './src/social-footer.css?v=1';
          await new Promise((resolve, reject) => {
            socialFooterStyles.onload = resolve;
            socialFooterStyles.onerror = () => reject(new Error('Falha ao carregar o rodapé do NekoGPT.'));
            document.head.appendChild(socialFooterStyles);
          });
          await loadScript('./src/social-footer.js?v=2');
          await loadScript('./src/wishlist-badge.js?v=1');
          await loadScript('./src/site-localization.js?v=1');

          // The page was revealed as soon as its header was ready.
        };

        loadPreview().catch((error) => {
          console.error('Falha ao carregar o NekoGPT:', error);
          // Errors in a late-loading section must never destroy the working hero.
          if (!bootFinished) {
            document.body.innerHTML = '<main id="preview-loader"><span>Não foi possível carregar o NekoGPT. Atualize a página para tentar novamente.</span></main>';
            finishBootstrap();
          }
        });
      })();
    </script>
  </body>
</html>
