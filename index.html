<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NekoGPT é um app desktop de companhia com IA, personagens Live2D, voz, memória e controles para criadores."
    />
    <meta
      name="keywords"
      content="NekoGPT, AI companion, Live2D, AI VTuber, voice chat, desktop companion, virtual assistant"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NekoGPT - App desktop de companhia com IA" />
    <meta
      property="og:description"
      content="Uma experiência de companhia com IA, personagens, voz, memória e integrações para criadores."
    />
    <meta property="og:image" content="./assets/images/dashboard-hero.png" />
    <meta name="theme-color" content="#050507" />
    <title>NekoGPT - App desktop de companhia com IA</title>
    <link rel="icon" type="image/png" href="./assets/images/icon-256.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="./assets/vendor/pixi/pixi.min.js" as="script" />
    <link rel="preload" href="./assets/vendor/pixi/pixi-sound.js" as="script" />
    <link rel="preload" href="./assets/vendor/live2d/live2dcubismcore.min.js" as="script" />
    <link rel="preload" href="./assets/vendor/live2d/cubism.min.js" as="script" />
    <link rel="preload" href="./assets/live2d/catgpt/catgpt.model3.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="./assets/live2d/catgpt/catgpt.moc3" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="./assets/live2d/cirno/cirno_live2d.model3.json" as="fetch" crossorigin="anonymous" />
    <link rel="stylesheet" href="./src/paw-spacing.css?v=120" />
    <link rel="stylesheet" href="./src/vanilla-cursors.css?v=121" />

    <style>
      html,body{min-height:100%;margin:0;background:#0a0a0a;color:#fff;font-family:Inter,system-ui,sans-serif}
      #preview-loader{min-height:100vh;display:grid;place-items:center;text-align:center}
      #preview-loader span{opacity:.72}
    </style>
  </head>
  <body>
    <div id="preview-loader"><span>Carregando preview do NekoGPT…</span></div>
    <script>
      (() => {
        const payloadParts = ["./payload/part-01.txt", "./payload/part-02.txt", "./payload/part-03.txt", "./payload/part-04.txt", "./payload/part-05.txt", "./payload/part-06.txt", "./payload/part-07.txt", "./payload/part-08.txt", "./payload/part-09.txt", "./payload/part-10.txt", "./payload/part-11.txt", "./payload/part-12.txt", "./payload/part-13.txt", "./payload/part-14.txt", "./payload/part-15.txt", "./payload/part-16.txt", "./payload/part-17.txt", "./payload/part-18.txt", "./payload/part-19.txt", "./payload/part-20.txt", "./payload/part-21.txt", "./payload/part-22.txt", "./payload/part-23.txt", "./payload/part-24.txt"];

        const loadScript = (src) => new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error(`Falha ao carregar ${src}`));
          document.body.appendChild(script);
        });

        const loadPreview = async () => {
          const encoded = (await Promise.all(payloadParts.map(async (path) => {
            const response = await fetch(path, { cache: 'no-store' });
            if (!response.ok) throw new Error(`Falha ao carregar ${path}`);
            return response.text();
          }))).join('');
          const bytes = Uint8Array.from(atob(encoded), (char) => char.charCodeAt(0));
          if (!("DecompressionStream" in window)) throw new Error('Navegador sem suporte a DecompressionStream');
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
          const payload = JSON.parse(await new Response(stream).text());
          const style = document.createElement('style');
          style.textContent = payload.css;
          document.head.appendChild(style);
          document.body.innerHTML = payload.body;
          new Function(payload.js)();

          await loadScript('./src/paw-fix.js?v=119');
          await loadScript('./src/site-customizations.js?v=126');
          await loadScript('./src/video-side-characters.js?v=128');
          await loadScript('./src/brand-feature-redesign.js?v=139');
        };

        loadPreview().catch((error) => {
          console.error(error);
          document.body.innerHTML = '<main id="preview-loader"><span>Não foi possível carregar o preview.</span></main>';
        });
      })();
    </script>
  </body>
</html>
