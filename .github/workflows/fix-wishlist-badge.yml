name: Fix wishlist badge asset
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-wishlist-badge.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - run: python scripts/fix-wishlist-badge.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/wishlist-now-fixed.png
          if ! git diff --cached --quiet; then
            git commit -m "fix: remove wishlist image line and frame"
            git push
          fi
