name: Patch Live2D payload

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-live2d-payload.mjs
      - .github/workflows/patch-live2d-payload.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch compressed website bundle
        run: node scripts/patch-live2d-payload.mjs

      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Cirno and rebuild native Neko Live2D hero [skip ci]"
          git push
